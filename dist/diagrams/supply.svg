<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Manage flows and relationships together</title><desc id="desc">Goods go towards customers. Orders usually go towards suppliers. Information moves both ways.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">Manage flows and relationships together</text><rect x="55.0" y="160" width="264.6666666666667" height="145" rx="12" fill="#bce6d0"/><text x="187.33333333333334" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Supplier</text><text x="187.33333333333334" y="221" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Inputs and capability</text><path d="M323.6666666666667 232L342.6666666666667 232" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><rect x="347.6666666666667" y="160" width="264.6666666666667" height="145" rx="12" fill="#d9e6f0"/><text x="480.0" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Campus Tees</text><text x="480.0" y="221" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Print and coordinate</text><path d="M616.3333333333334 232L635.3333333333334 232" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><rect x="640.3333333333334" y="160" width="264.6666666666667" height="145" rx="12" fill="#bce6d0"/><text x="772.6666666666667" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Customer</text><text x="772.6666666666667" y="221" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Use the final outcome</text><text x="480" y="120" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#163e36" text-anchor="middle">MATERIALS AND PRODUCTS →</text><text x="480" y="355" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#163e36" text-anchor="middle">← REQUIREMENTS INFORMATION</text><text x="480" y="392" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#163e36" text-anchor="middle">Availability, status and changes travel both ways.</text></svg>