<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Porter’s value chain</title><desc id="desc">The model shows five main activities and four support activities. They affect value and cost.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">Porter’s value chain</text><rect x="75" y="77" width="810" height="37" rx="12" fill="#d9e6f0"/><text x="480.0" y="107" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Infrastructure</text><rect x="75" y="121" width="810" height="37" rx="12" fill="#d9e6f0"/><text x="480.0" y="151" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Human resource management</text><rect x="75" y="165" width="810" height="37" rx="12" fill="#d9e6f0"/><text x="480.0" y="195" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Technology development</text><rect x="75" y="209" width="810" height="37" rx="12" fill="#d9e6f0"/><text x="480.0" y="239" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Procurement</text><rect x="75" y="285" width="154" height="110" rx="12" fill="#bce6d0"/><text x="152.0" y="315" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Inbound</text><text x="152.0" y="338" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">logistics</text><rect x="239" y="285" width="154" height="110" rx="12" fill="#bce6d0"/><text x="316.0" y="315" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Operations</text><rect x="403" y="285" width="154" height="110" rx="12" fill="#bce6d0"/><text x="480.0" y="315" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Outbound</text><text x="480.0" y="338" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">logistics</text><rect x="567" y="285" width="154" height="110" rx="12" fill="#bce6d0"/><text x="644.0" y="315" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Marketing &amp;</text><text x="644.0" y="338" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">sales</text><rect x="731" y="285" width="154" height="110" rx="12" fill="#bce6d0"/><text x="808.0" y="315" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Service</text><text x="480" y="430" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#163e36" text-anchor="middle">Primary activities supported by capabilities across the firm</text></svg>