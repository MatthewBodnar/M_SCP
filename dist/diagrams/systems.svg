<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Information tools support different decisions</title><desc id="desc">ERP integrates processes; MPS plans output; MRP plans material; WMS supports warehouse execution.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">Information tools support different decisions</text><rect x="55.0" y="160" width="191.5" height="145" rx="12" fill="#bce6d0"/><text x="150.75" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">ERP</text><text x="150.75" y="221" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Connect business data</text><path d="M250.5 232L269.5 232" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><rect x="274.5" y="160" width="191.5" height="145" rx="12" fill="#d9e6f0"/><text x="370.25" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">MPS</text><text x="370.25" y="221" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Plan output and</text><text x="370.25" y="241" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">timing</text><path d="M470.0 232L489.0 232" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><rect x="494.0" y="160" width="191.5" height="145" rx="12" fill="#bce6d0"/><text x="589.75" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">MRP</text><text x="589.75" y="221" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">What materials, how</text><text x="589.75" y="241" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">much, when?</text><path d="M689.5 232L708.5 232" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><rect x="713.5" y="160" width="191.5" height="145" rx="12" fill="#d9e6f0"/><text x="809.25" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">WMS</text><text x="809.25" y="221" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Receive, locate, pick</text><text x="809.25" y="241" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">and dispatch</text></svg>