<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Organise possible causes before testing them</title><desc id="desc">People, machines, material and methods are investigation categories, not proof of causation.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">Organise possible causes before testing them</text><path d="M100 245L850 245" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><text x="760" y="218" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="start">Late orders</text><path d="M270 100L370 245" fill="none" stroke="#163e36" stroke-width="2.5" /><text x="205" y="75" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#163e36" text-anchor="start">People</text><text x="205" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="start">Training / roles</text><path d="M570 100L670 245" fill="none" stroke="#163e36" stroke-width="2.5" /><text x="505" y="75" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#163e36" text-anchor="start">Machines</text><text x="505" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="start">Breakdowns / setup</text><path d="M270 390L370 245" fill="none" stroke="#163e36" stroke-width="2.5" /><text x="205" y="410" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#163e36" text-anchor="start">Material</text><text x="205" y="435" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="start">Shortage / quality</text><path d="M570 390L670 245" fill="none" stroke="#163e36" stroke-width="2.5" /><text x="505" y="410" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#163e36" text-anchor="start">Methods</text><text x="505" y="435" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="start">Queues / handovers</text></svg>