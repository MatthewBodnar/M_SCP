<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Agreement is not finished until it is implemented</title><desc id="desc">Preparation, greeting, introduction, argumentation, compromise, closure and realisation.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">Agreement is not finished until it is implemented</text><rect x="55" y="115" width="190" height="100" rx="12" fill="#bce6d0"/><text x="150.0" y="145" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">1 · Prepare</text><path d="M250 165L270 165" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><rect x="275" y="115" width="190" height="100" rx="12" fill="#bce6d0"/><text x="370.0" y="145" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">2 · Greet</text><path d="M470 165L490 165" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><rect x="495" y="115" width="190" height="100" rx="12" fill="#bce6d0"/><text x="590.0" y="145" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">3 · Introduce</text><path d="M690 165L710 165" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><rect x="715" y="115" width="190" height="100" rx="12" fill="#bce6d0"/><text x="810.0" y="145" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">4 · Argue</text><rect x="55" y="295" width="190" height="100" rx="12" fill="#d9e6f0"/><text x="150.0" y="325" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-ancho