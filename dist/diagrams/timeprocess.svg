<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Follow elapsed time, not only processing time</title><desc id="desc">Teaching example: four hours of activity plus twelve hours waiting, then six waiting hours removed.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">Follow elapsed time, not only processing time</text><text x="70" y="110" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="start">Before: 16 hours</text><rect x="70" y="140" width="200" height="60" rx="12" fill="#bce6d0"/><text x="170.0" y="170" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Activity 4h</text><rect x="270" y="140" width="600" height="60" rx="12" fill="#efb88f"/><text x="570.0" y="170" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Waiting 12h</text><text x="70" y="270" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="start">After: 10 hours</text><rect x="70" y="300" width="200" height="60" rx="12" fill="#bce6d0"/><text x="170.0" y="330" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Activity 4h</text><rect x="270" y="300" width="300" height="60" rx="12" fill="#efb88f"/><text x="420.0" y="330" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Waiting 6h</text><text x="70" y="415" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#163e36" text-anchor="start">Illustrative: halving waiting saves more than a small increase in machine speed.</text></svg>