<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Choose whom to serve and what to promise</title><desc id="desc">Find groups, choose which to serve, and explain the offer. Each stage has two steps.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">Choose whom to serve and what to promise</text><rect x="55.0" y="160" width="264.6666666666667" height="145" rx="12" fill="#bce6d0"/><text x="187.33333333333334" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Segment</text><text x="187.33333333333334" y="221" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Identify bases; profile</text><text x="187.33333333333334" y="241" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">groups</text><path d="M323.6666666666667 232L342.6666666666667 232" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><rect x="347.6666666666667" y="160" width="264.6666666666667" height="145" rx="12" fill="#d9e6f0"/><text x="480.0" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Target</text><text x="480.0" y="221" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Evaluate appeal; choose</text><text x="480.0" y="241" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">groups</text><path d="M616.3333333333334 232L635.3333333333334 232" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><rect x="640.33