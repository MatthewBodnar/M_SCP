<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">IMP: interaction sits inside a wider context</title><desc id="desc">Firms and people exchange goods, information, money and social contact. The wider situation affects them.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">IMP: interaction sits inside a wider context</text><rect x="65" y="85" width="830" height="330" rx="12" fill="#d9e6f0"/><text x="480.0" y="115" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Environment</text><rect x="100" y="140" width="760" height="245" rx="12" fill="#e7eee2"/><text x="480.0" y="170" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Atmosphere</text><text x="480.0" y="201" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Power, dependence, cooperation and expectations</text><rect x="140" y="240" width="220" height="100" rx="12" fill="#bce6d0"/><text x="250.0" y="270" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Actor A</text><text x="250.0" y="301" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Organisation + people</text><rect x="600" y="240" width="220" height="100" rx="12" fill="#efb88f"/><text x="710.0" y="270" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Actor B</text><text x="710.0" y="301" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Organisation + people</text><path d="M375 280L585 280" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><text x="480" y="240" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Exchange episodes</text><text x="480" y="370" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Repeated interaction → adaptation and established routines</text></svg>