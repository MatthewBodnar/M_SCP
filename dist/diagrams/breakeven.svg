<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Break-even: contribution covers fixed cost</title><desc id="desc">Illustrative linear chart: F=1200, p=15, v=9; break-even is 200 shirts.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">Break-even: contribution covers fixed cost</text><path d="M90 365L880 365" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><path d="M90 365L90 90" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><text x="92" y="78" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#163e36" text-anchor="start">Cost / revenue (€)</text><text x="480" y="420" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#163e36" text-anchor="middle">Quantity (shirts)</text><polyline points="90.0,365.0 850.0,90.0" fill="none" stroke="#163e36" stroke-width="4"/><polyline points="90.0,255.0 850.0,145.0" fill="none" stroke="#b5704b" stroke-width="4"/><path d="M90 255L850 255" fill="none" stroke="#66766e" stroke-width="2.5" stroke-dasharray="7 6" /><path d="M596 182L596 365" fill="none" stroke="#66766e" stroke-width="2.5" stroke-dasharray="7 6" /><text x="620" y="175" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#163e36" text-anchor="start">Break-even: 200</text><text x="730" y="85" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="start">Revenue</text><text x="745" y="140" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="start">Total cost</text><text x="110" y="245" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="start">Fixed cost €1,200</text></svg>