<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Reorder before the stock is exhausted</title><desc id="desc">Order size is 600. Daily use is 40. Delivery takes 5 days. Safety stock is 60. Reorder at 260.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">Reorder before the stock is exhausted</text><path d="M90 365L880 365" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><path d="M90 365L90 90" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><text x="92" y="78" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#163e36" text-anchor="start">Units in stock</text><text x="480" y="420" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#163e36" text-anchor="middle">Working days</text><polyline points="95.0,110.0 440.0,330.0 442.0,110.0 787.0,330.0 789.0,110.0 860.0,155.0" fill="none" stroke="#163e36" stroke-width="4"/><path d="M95 255L860 255" fill="none" stroke="#b5704b" stroke-width="2.5" stroke-dasharray="7 6" /><path d="M95 330L860 330" fill="none" stroke="#66766e" stroke-width="2.5" stroke-dasharray="7 6" /><text x="570" y="246" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#163e36" text-anchor="start">ROP 260</text><text x="570" y="322" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="start">Safety stock 60</text><path d="M325 255L325 365" fill="none" stroke="#66766e" stroke-width="2.5" stroke-dasharray="7 6" /><text x="245" y="402" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="start">Order → 5-day lead → receipt</text><text x="110" y="100" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="start">660</text></svg>