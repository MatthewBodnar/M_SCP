<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Divide value · create value</title><desc id="desc">A negotiation can divide existing value and find new value. It can do both.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">Divide value · create value</text><rect x="80" y="125" width="350" height="230" rx="12" fill="#d9e6f0"/><text x="255.0" y="155" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Distributive</text><text x="255.0" y="186" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Divide a fixed pie: price with all</text><text x="255.0" y="206" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">other conditions fixed</text><rect x="530" y="125" width="350" height="230" rx="12" fill="#bce6d0"/><text x="705.0" y="155" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Integrative</text><text x="705.0" y="186" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Create value: combine price, volume,</text><text x="705.0" y="206" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">timing and service</text><text x="480" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#163e36" text-anchor="middle">A negotiation can create value and then negotiate how to share it.</text></svg>