<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Four Rs, four distinct questions</title><desc id="desc">Responsiveness, reliability, resilience and relationships each address a different requirement.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">Four Rs, four distinct questions</text><rect x="55.0" y="160" width="191.5" height="145" rx="12" fill="#bce6d0"/><text x="150.75" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Responsive</text><text x="150.75" y="221" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">How quickly can we</text><text x="150.75" y="241" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">act?</text><path d="M250.5 232L269.5 232" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><rect x="274.5" y="160" width="191.5" height="145" rx="12" fill="#d9e6f0"/><text x="370.25" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Reliable</text><text x="370.25" y="221" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">How consistently do</text><text x="370.25" y="241" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">we deliver?</text><path d="M470.0 232L489.0 232" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><rect x="494.0" y="160" width="191.5" height="145" rx="12" fill="#bce6d0"/><text x="589.75" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Resilient</text><text x="589.75" y="221" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Can we recover from</text><text x="589.75" y="241" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">surprise?</text><path d="M689.5 232L708.5 232" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><rect x="713.5" y="160" width="191.5" height="145" rx="12" fill="#d9e6f0"/><text x="809.25" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Relationships</text><text x="809.25" y="221" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Can we coordinate</text><text x="809.25" y="241" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">dependencies?</text></svg>