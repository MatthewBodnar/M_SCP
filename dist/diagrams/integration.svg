<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">The scope of integration expands</title><desc id="desc">Move from separate departments to working with suppliers and customers.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">The scope of integration expands</text><rect x="55" y="105" width="195" height="140" rx="12" fill="#d9e6f0"/><text x="152.5" y="135" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">1 · Baseline</text><text x="152.5" y="166" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Separate departments</text><text x="152.5" y="186" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">and buffers</text><rect x="275" y="147" width="195" height="140" rx="12" fill="#bce6d0"/><text x="372.5" y="177" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">2 · Functional</text><text x="372.5" y="208" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Coordinate related</text><text x="372.5" y="228" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">functions</text><rect x="495" y="189" width="195" height="140" rx="12" fill="#efb88f"/><text x="592.5" y="219" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">3 · Internal</text><text x="592.5" y="250" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">One connected company</text><text x="592.5" y="270" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">plan</text><rect x="715" y="231" width="195" height="140" rx="12" fill="#d6ddbd"/><text x="812.5" y="261" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">4 · External</text><text x="812.5" y="292" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Include suppliers and</text><text x="812.5" y="312" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">customers</text></svg>