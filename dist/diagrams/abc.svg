<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Prioritise attention by annual usage value</title><desc id="desc">Illustrative five-item dataset totals €10,000; the first item contributes €8,000.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">Prioritise attention by annual usage value</text><rect x="155" y="136.42857142857142" width="85" height="228.57142857142858" rx="5" fill="#163e36"/><text x="197" y="393" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#163e36" text-anchor="middle">A</text><text x="197" y="121.42857142857142" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#163e36" text-anchor="middle">€8,000</text><rect x="300" y="342.14285714285717" width="85" height="22.857142857142858" rx="5" fill="#bce6d0"/><text x="342" y="393" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#163e36" text-anchor="middle">B</text><text x="342" y="327.14285714285717" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#163e36" text-anchor="middle">€800</text><rect x="445" y="347.85714285714283" width="85" height="17.142857142857142" rx="5" fill="#bce6d0"/><text x="487" y="393" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#163e36" text-anchor="middle">C</text><text x="487" y="332.85714285714283" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#163e36" text-anchor="middle">€600</text><rect x="590" y="353.57142857142856" width="85" height="11.428571428571429" rx="5" fill="#bce6d0"/><text x="632" y="393" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#163e36" text-anchor="middle">D</text><text x="632" y="338.57142857142856" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#163e36" text-anchor="middle">€400</text><rect x="735" y="359.2857142857143" width="85" height="5.714285714285714" rx="5" fill="#bce6d0"/><text x="777" y="393" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#163e36" text-anchor="middle">E</text><text x="777" y="344.2857142857143" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#163e36" text-anchor="middle">€200</text><text x="480" y="95" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#163e36" text-anchor="middle">One of five SKUs accounts for 80% of annual usage value.</text></svg>