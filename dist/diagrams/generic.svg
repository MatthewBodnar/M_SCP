<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Match strategy to demand and supply timing</title><desc id="desc">Demand predictability is horizontal; long supply lead time is above short supply lead time.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#163e36"/></marker></defs><rect width="960" height="460" rx="16" fill="#f6f8f3"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163e36" text-anchor="start">Match strategy to demand and supply timing</text><rect x="145" y="90" width="325" height="120" rx="12" fill="#bce6d0"/><text x="307.5" y="120" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Lean</text><text x="307.5" y="151" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Long lead: plan and optimise</text><rect x="490" y="90" width="325" height="120" rx="12" fill="#d9e6f0"/><text x="652.5" y="120" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Hybrid / leagile</text><text x="652.5" y="151" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Long lead: postpone differentiation</text><rect x="145" y="225" width="325" height="120" rx="12" fill="#efb88f"/><text x="307.5" y="255" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Kanban</text><text x="307.5" y="286" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Short lead: replenish continuously</text><rect x="490" y="225" width="325" height="120" rx="12" fill="#e6e9d5"/><text x="652.5" y="255" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163e36" text-anchor="middle">Agile</text><text x="652.5" y="286" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#163e36" text-anchor="middle">Short lead: quick response</text><path d="M120 365L855 365" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><path d="M120 365L120 80" fill="none" stroke="#163e36" stroke-width="2.5" marker-end="url(#a)" /><text x="500" y="411" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#163e36" text-anchor="middle">Predictable demand ← → Unpredictable</text><text x="150" y="385" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#163e36" text-anchor="start">Low</text><text x="812" y="385" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#163e36" text-anchor="start">High</text><text x="23" y="95" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#163e36" text-anchor="start">High</text><text x="29" y="350" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#163e36" text-anchor="start">Low</text><text x="22" y="232" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#163e36" text-anchor="start">Lead time</text></svg>